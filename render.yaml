# Déploiement Render (https://render.com) : New + → Blueprint → choisir ce dépôt
services:
  - type: web
    name: cnc-tutor
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/cours/info
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false   # Render demande la valeur à la création (jamais dans le dépôt)
