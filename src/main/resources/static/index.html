<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuteur – Programmation CNC</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        </span>
        <div>
          <h1>Tuteur – Programmation CNC</h1>
          <p class="subtitle">Pose tes questions sur le cours, je t'explique pas à pas.</p>
        </div>
      </div>
      <button id="resetBtn" class="btn-secondary" type="button" title="Effacer l'historique">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Nouvelle conversation</span>
      </button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <h2>Bonjour 👋</h2>
        <p>Je réponds uniquement à partir du cours « Programmation CNC ». Les références <strong>(page X)</strong> sont cliquables pour voir la page et ses schémas.</p>
        <div class="suggestions" id="suggestions">
          <button type="button">C'est quoi une MOCN ?</button>
          <button type="button">Explique les origines OM, Op, OP</button>
          <button type="button">Différence entre G02 et G03</button>
          <button type="button">Explique la correction de rayon G41/G42</button>
          <button type="button">Explique le cycle G83</button>
          <button type="button">Explique le cycle G71 en tournage</button>
        </div>
      </section>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Pose ta question sur le cours…" maxlength="4000" required></textarea>
      <button id="sendBtn" type="submit" class="btn-primary" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <button id="prevPage" type="button" class="icon-btn" aria-label="Page précédente">‹</button>
        <span id="modalTitle">Page</span>
        <button id="nextPage" type="button" class="icon-btn" aria-label="Page suivante">›</button>
        <button id="closeModal" type="button" class="icon-btn close" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body">
        <div id="modalLoading" class="loader">Chargement…</div>
        <img id="modalImg" alt="Page du cours">
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
