spring.application.name=cnc-tutor
# Lit LLM_API_KEY depuis un fichier .env à la racine (facultatif, ignoré par git)
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# --- API LLM (format OpenAI-compatible) ---
llm.base-url=https://api.groq.com/openai/v1
# llama-3.3-70b-versatile a été retiré par Groq ; liste à jour : GET {base-url}/models
llm.model=openai/gpt-oss-120b
# Clé lue UNIQUEMENT depuis la variable d'environnement LLM_API_KEY (vide si absente)
llm.api-key=${LLM_API_KEY:}
llm.temperature=0.3
# Groq gratuit : cours (~5 200 tokens) + max-tokens doit rester < 8 000 tokens/minute
llm.max-tokens=2048
# Modèles « raisonnants » (gpt-oss) : low = réflexion courte ; laisser vide pour les autres
llm.reasoning-effort=low
llm.connect-timeout=10s
llm.read-timeout=120s

# --- Cours ---
cours.pdf-path=cours/PROGRAMMATION_CNC.pdf
cours.render-dpi=120
# Au-delà de cette taille, seules les pages pertinentes + le plan sont envoyés
# (quota gratuit Groq : 8 000 tokens/min). Mettre 100000 pour envoyer tout le cours.
cours.max-context-chars=9000
chat.history-size=10
chat.history-max-chars=3000

# SSE : pas de timeout côté MVC async (géré par SseEmitter)
spring.mvc.async.request-timeout=-1
